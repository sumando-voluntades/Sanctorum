<!--
  Barra lateral (sidebar) compartida por TODAS las páginas del panel de administración
  (dashboard, expedientes, voluntariado, inventario, agenda, publicaciones, reportes,
  aliados_donativos, perfil). Antes este bloque estaba copiado y pegado en cada página;
  ahora vive en un solo lugar y cada página lo inserta con incluirParcial() (ver js/incluir.js).

  Cómo se resalta la pestaña activa: cada <a> tiene un atributo data-pagina con el nombre
  de la página a la que apunta (sin extensión, igual que en el href). Después de insertar
  este parcial, marcarLinkActivo('#sidebar-mount [data-pagina]') (función en js/comun.js)
  compara cada data-pagina contra la URL actual y le agrega el estilo de "seleccionado".

  Versión para teléfono: en pantallas angostas (menos de 768px) esta barra empieza oculta
  fuera de la pantalla (-translate-x-full) y solo aparece cuando el botón de menú del header
  (partials/header_admin.html) la abre con toggleSidebarMovil() (función en js/comun.js). En
  pantallas medianas/grandes (md: en adelante) siempre está visible (md:translate-x-0), como
  antes. El fondo oscuro semitransparente permite cerrarla tocando fuera de ella.
-->
<div
  id="backdrop_sidebar_movil"
  class="hidden fixed inset-0 bg-slate-900/50 z-40 md:hidden"
  onclick="cerrarSidebarMovil()"
></div>
<aside
  id="sidebar_admin"
  class="fixed left-0 top-0 flex flex-col py-8 bg-white rounded-r-[2rem] h-screen w-72 shadow-[0_20px_50px_rgba(23,28,31,0.06)] z-50 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out"
>
  <div class="flex justify-center items-center mb-10 px-8 relative">
    <img src="/assets/logo.png" alt="Logo" class="w-40 h-auto object-contain" />
    <button
      type="button"
      onclick="cerrarSidebarMovil()"
      class="md:hidden absolute right-4 top-0 p-2 text-slate-400 hover:text-slate-600"
      aria-label="Cerrar menú"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <nav class="flex-1 px-4 space-y-2">
    <a
      data-pagina="dashboard"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="dashboard"
      ><span class="material-symbols-outlined">dashboard</span
      ><span class="font-medium">Resumen</span></a
    >
    <a
      data-pagina="expedientes"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="expedientes"
      ><span class="material-symbols-outlined">folder_shared</span
      ><span class="font-medium">Expedientes</span></a
    >
    <a
      data-pagina="voluntariado"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="voluntariado"
      ><span class="material-symbols-outlined">group</span
      ><span class="font-medium">Voluntariado</span></a
    >
    <a
      data-pagina="inventario"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="inventario"
      ><span class="material-symbols-outlined">inventory_2</span
      ><span class="font-medium">Inventario</span></a
    >
    <a
      data-pagina="agenda"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="agenda"
      ><span class="material-symbols-outlined">school</span
      ><span class="font-medium">Agenda</span></a
    >
    <a
      data-pagina="publicaciones"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="publicaciones"
      ><span class="material-symbols-outlined">campaign</span
      ><span class="font-medium">Publicaciones</span></a
    >
    <a
      data-pagina="reportes"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="reportes"
      ><span class="material-symbols-outlined">fact_check</span
      ><span class="font-medium">Reportes</span></a
    >
    <a
      data-pagina="aliados_donativos"
      class="flex items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 transition-all"
      href="aliados_donativos"
      ><span class="material-symbols-outlined">volunteer_activism</span
      ><span class="font-medium">Aliados y Donativos</span></a
    >
  </nav>
  <div class="px-6 mt-auto space-y-4">
    <a
      class="flex items-center justify-center gap-2 w-full py-3 text-slate-500 hover:text-orange-600 hover:bg-orange-50 rounded-full font-bold transition-all border border-slate-200"
      href="index"
      ><span class="material-symbols-outlined">home</span>Volver al Inicio</a
    >
    <button
      onclick="cerrarSesion()"
      class="flex items-center justify-center gap-2 w-full py-3 text-red-500 hover:text-red-600 hover:bg-red-50 rounded-full font-bold transition-all"
    >
      <span class="material-symbols-outlined">logout</span>Cerrar Sesión
    </button>
  </div>
</aside>
