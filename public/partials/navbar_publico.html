<!--
  Barra de navegación superior compartida por todas las páginas del sitio público
  (index, nosotros, como_ayudar, comunidad_blog, calendario_eventos, evento_detalle,
  solicitud_apoyo_oficial). Antes estaba copiada en cada página, con enlaces y estilos
  que se fueron desalineando con el tiempo; ahora vive en un solo archivo.

  Pestaña activa: cada <a> del menú tiene data-pagina; marcarLinkActivo() (en js/comun.js)
  le agrega el estilo resaltado ("text-orange-700 font-bold border-b-2 border-orange-500")
  al enlace cuya data-pagina coincida con la página actual, y quita ese estilo de los demás.

  El ícono de "Panel de Administración" apunta siempre a login (antes, en varias páginas
  apuntaba directo a expedientes, saltándose el login — se corrigió aquí una sola vez).
-->
<header
  class="fixed top-0 w-full z-50 rounded-b-xl bg-white/70 backdrop-blur-md shadow-[0_20px_50px_rgba(23,28,31,0.06)]"
>
  <div class="flex justify-between items-center max-w-7xl mx-auto px-8 py-4">
    <div class="flex items-center gap-3">
      <img
        alt="Logo Sumando Voluntades Sanctórum"
        class="h-12 w-auto object-contain"
        src="/public/assets/Logo.png"
      />
    </div>

    <!-- Botón de menú para móvil: antes no existía ningún control para revelar el menú en
         pantallas pequeñas (el <nav> de abajo es "hidden md:flex"), así que en teléfono el
         menú simplemente no aparecía. Ahora este botón lo muestra/oculta. -->
    <button
      id="btn_menu_movil"
      type="button"
      class="md:hidden p-2 text-slate-700"
      aria-label="Abrir menú"
      aria-expanded="false"
      aria-controls="menu_publico_movil"
    >
      <span class="material-symbols-outlined text-3xl">menu</span>
    </button>

    <nav class="hidden md:flex gap-8 items-center">
      <a
        data-pagina="index"
        class="text-slate-600 hover:text-pink-600 transition-colors duration-300"
        href="index"
        >Inicio</a
      >
      <a
        data-pagina="comunidad_blog"
        class="text-slate-600 hover:text-pink-600 transition-colors duration-300"
        href="comunidad_blog"
        >Comunidad</a
      >
      <a
        data-pagina="solicitud_apoyo_oficial"
        class="text-slate-600 hover:text-pink-600 transition-colors duration-300"
        href="solicitud_apoyo_oficial"
        >Solicitud de Apoyo</a
      >
      <a
        data-pagina="como_ayudar"
        class="text-slate-600 hover:text-pink-600 transition-colors duration-300"
        href="como_ayudar"
        >Cómo Ayudar</a
      >
      <a
        data-pagina="nosotros"
        class="text-slate-600 hover:text-pink-600 transition-colors duration-300"
        href="nosotros"
        >Nosotros</a
      >
    </nav>
    <div class="hidden md:flex items-center gap-4">
      <a
        href="login"
        title="Panel de Administración"
        class="material-symbols-outlined text-slate-600 hover:text-orange-600 transition-all"
        >admin_panel_settings</a
      >
      <a
        href="como_ayudar#formVoluntariadoPublico"
        class="hidden lg:block px-6 py-2 rounded-full border border-secondary text-secondary font-semibold hover:bg-secondary-container hover:text-white transition-all"
        >Voluntariado</a
      >
      <a
        href="index#donacion-monetaria"
        class="bg-gradient-to-r from-primary to-primary-container text-white px-8 py-2 rounded-full font-bold shadow-lg hover:scale-105 active:scale-95 transition-all"
        >Donar</a
      >
    </div>
  </div>

  <!-- Menú desplegable de móvil: mismos enlaces que el <nav> de escritorio, apilados. -->
  <nav
    id="menu_publico_movil"
    class="hidden md:hidden flex-col gap-1 px-6 pb-6 pt-2 bg-white/95 backdrop-blur-md"
  >
    <a
      data-pagina="index"
      class="block py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-pink-600 transition-colors"
      href="index"
      >Inicio</a
    >
    <a
      data-pagina="comunidad_blog"
      class="block py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-pink-600 transition-colors"
      href="comunidad_blog"
      >Comunidad</a
    >
    <a
      data-pagina="solicitud_apoyo_oficial"
      class="block py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-pink-600 transition-colors"
      href="solicitud_apoyo_oficial"
      >Solicitud de Apoyo</a
    >
    <a
      data-pagina="como_ayudar"
      class="block py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-pink-600 transition-colors"
      href="como_ayudar"
      >Cómo Ayudar</a
    >
    <a
      data-pagina="nosotros"
      class="block py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-pink-600 transition-colors"
      href="nosotros"
      >Nosotros</a
    >
    <a
      href="login"
      class="flex items-center gap-2 py-3 px-2 rounded-xl text-slate-600 hover:bg-slate-50"
      ><span class="material-symbols-outlined text-lg"
        >admin_panel_settings</span
      >
      Panel de Administración</a
    >
    <a
      href="como_ayudar#formVoluntariadoPublico"
      class="text-center mt-2 px-6 py-3 rounded-full border border-secondary text-secondary font-semibold"
      >Voluntariado</a
    >
    <a
      href="index#donacion-monetaria"
      class="text-center mt-2 bg-gradient-to-r from-primary to-primary-container text-white px-8 py-3 rounded-full font-bold shadow-lg"
      >Donar</a
    >
  </nav>
</header>
